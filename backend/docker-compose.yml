version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=sqlite:///./trading_signals.db
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./src:/app/src
      - ./trading_signals.db:/app/trading_signals.db
  
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
